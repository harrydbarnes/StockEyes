<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Stock Market Monitor</h1>
        <div id="key-market-tickers-content">
            <!-- Key market tickers will be populated here by script.js -->
        </div>
        <button id="refresh-data-btn">Refresh Data</button>
    </header>
    <main>
        <section id="main-players">
            <h2>Main Players</h2>
            <!-- Content for Main Players -->
        </section>
        <section id="huge-risers">
            <h2>Huge Risers</h2>
            <!-- Content for Huge Risers -->
        </section>
        <section id="big-dippers">
            <h2>Big Dippers</h2>
            <!-- Content for Big Dippers -->
        </section>
        <section id="little-dippers">
            <h2>Little Dippers</h2>
            <!-- Content for Little Dippers -->
        </section>
        <section id="custom-watchlist">
            <h2>Custom Watchlist</h2>
            <input type="search" id="watchlist-search" name="watchlist-search" placeholder="Search stocks...">
            <div id="watchlist-results">
                <!-- Search results will be populated here -->
            </div>
        </section>
        <section id="stock-evaluator">
            <h2>Stock Evaluator</h2>
            <!-- Placeholder for Stock Evaluator -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
